[package]
name = "xianyu-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
rig-core = "0.41"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }

rust_xlsxwriter = "0.84"
# DTO → TypeScript 类型自动生成：cargo test export_bindings 时把 interfaces/dto.rs 中带
# #[derive(TS)] 的结构体导出到 web/src/types/generated/（TS_RS_EXPORT_DIR 见 .cargo/config.toml）
ts-rs = "10"

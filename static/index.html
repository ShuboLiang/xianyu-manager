<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闲鱼爬虫管理台</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>闲鱼爬虫管理台</h1>
        <span id="status" class="status">检测服务中…</span>
    </header>

    <main>
        <section class="card">
            <h2>标签管理</h2>
            <div class="form-row">
                <input id="tagName" type="text" placeholder="标签名，如：二手相机">
                <input id="tagRemark" type="text" placeholder="备注（可选）">
                <button id="tagSubmitBtn">添加标签</button>
                <button id="tagCancelBtn" class="btn-secondary" hidden>取消编辑</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>标签名</th>
                        <th>状态</th>
                        <th>备注</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tagTable">
                    <tr><td colspan="4" class="empty">暂无标签</td></tr>
                </tbody>
            </table>
        </section>

        <section class="card">
            <h2>待爬取商品管理</h2>
            <div class="form-row">
                <input id="productName" type="text" placeholder="商品名，如：佳能 5D4 机身">
                <input id="productRemark" type="text" placeholder="备注（可选）">
                <button id="productSubmitBtn">添加商品</button>
                <button id="productCancelBtn" class="btn-secondary" hidden>取消编辑</button>
            </div>
            <div id="productTagList" class="tag-checkboxes">
                <span class="muted">暂无标签可勾选</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>商品名</th>
                        <th>标签</th>
                        <th>中位数</th>
                        <th>均价</th>
                        <th>爬取数量</th>
                        <th>最后爬取</th>
                        <th>回收价</th>
                        <th>备注</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="productTable">
                    <tr><td colspan="9" class="empty">暂无商品</td></tr>
                </tbody>
            </table>
        </section>

        <section class="card">
            <h2>发起抓取</h2>
            <div class="form-row">
                <input id="keyword" type="text" placeholder="搜索关键词，如：MacBook Pro">
                <input id="maxPages" type="number" value="1" min="1" max="50" title="抓取页数">
                <button id="crawlBtn">开始抓取</button>
            </div>
        </section>

        <section class="card">
            <h2>商品列表</h2>
            <button id="refreshBtn">刷新列表</button>
            <table>
                <thead>
                    <tr>
                        <th>标题</th>
                        <th>价格</th>
                        <th>卖家</th>
                        <th>抓取时间</th>
                        <th>链接</th>
                    </tr>
                </thead>
                <tbody id="itemTable">
                    <tr><td colspan="5" class="empty">暂无数据</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闲鱼爬虫管理台</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>闲鱼爬虫管理台</h1>
        <span id="status" class="status">检测服务中…</span>
    </header>

    <main>
        <section class="card">
            <h2>标签管理</h2>
            <div class="form-row">
                <input id="tagName" type="text" placeholder="标签名，如：二手相机">
                <input id="tagRemark" type="text" placeholder="备注（可选）">
                <button id="tagSubmitBtn">添加标签</button>
                <button id="tagCancelBtn" class="btn-secondary" hidden>取消编辑</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>标签名</th>
                        <th>状态</th>
                        <th>备注</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tagTable">
                    <tr><td colspan="4" class="empty">暂无标签</td></tr>
                </tbody>
            </table>
        </section>

        <section class="card">
            <div class="card-head">
                <h2>抓取队列</h2>
                <div class="head-actions">
                    <button id="pauseAllBtn" class="btn-secondary">全部暂停</button>
                    <button id="resumeAllBtn">全部恢复</button>
                </div>
            </div>
            <div id="appendBanner" class="append-banner" hidden>
                正在向队列 #<span id="appendQueueId"></span> 追加条目
                <a href="#" onclick="exitAppendMode(); return false;">退出追加</a>
            </div>
            <div class="selector-grid">
                <div>
                    <h3>全部包含（AND）</h3>
                    <div id="selAll" class="tag-checkboxes"><span class="muted">暂无标签</span></div>
                </div>
                <div>
                    <h3>任一包含（OR）</h3>
                    <div id="selAny" class="tag-checkboxes"><span class="muted">暂无标签</span></div>
                </div>
                <div>
                    <h3>排除（NOT）</h3>
                    <div id="selExclude" class="tag-checkboxes"><span class="muted">暂无标签</span></div>
                </div>
            </div>
            <div class="form-row">
                <input id="staleDays" type="number" min="1" placeholder="N 天未爬（可选）" title="最后爬取时间距今 ≥ N 天">
                <input id="intervalSecs" type="number" min="1" value="3" title="条间间隔（秒）" style="width: 90px">
                <button id="previewBtn" class="btn-secondary">预览</button>
                <button id="enqueueBtn">加入队列</button>
            </div>
            <div id="previewResult" class="preview-result" hidden></div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>状态</th>
                        <th>进度</th>
                        <th>间隔</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="queueTable">
                    <tr><td colspan="6" class="empty">暂无队列</td></tr>
                </tbody>
            </table>
            <div id="historyToggle" class="history-toggle" hidden>
                <a href="#" onclick="toggleHistory(); return false;"><span id="historyArrow">▸</span> 历史队列（<span id="historyCount">0</span>）</a>
            </div>
            <table id="historyTableWrap" hidden>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>状态</th>
                        <th>进度</th>
                        <th>间隔</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="historyTable"></tbody>
            </table>
        </section>

        <section class="card">
            <h2>待爬取商品管理</h2>
            <div class="form-row">
                <input id="productName" type="text" placeholder="商品名，如：佳能 5D4 机身">
                <input id="productRemark" type="text" placeholder="备注（可选）">
                <button id="productSubmitBtn">添加商品</button>
                <button id="productCancelBtn" class="btn-secondary" hidden>取消编辑</button>
                <button id="crawlSelectedBtn" class="btn-secondary">选中加入队列</button>
            </div>
            <div id="productTagList" class="tag-checkboxes">
                <span class="muted">暂无标签可勾选</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th></th>
                        <th>商品名</th>
                        <th>标签</th>
                        <th>中位数</th>
                        <th>均价</th>
                        <th>爬取数量</th>
                        <th>最后爬取</th>
                        <th>回收价</th>
                        <th>备注</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="productTable">
                    <tr><td colspan="10" class="empty">暂无商品</td></tr>
                </tbody>
            </table>
        </section>

        <section class="card">
            <h2>商品列表（已抓取的原始数据）</h2>
            <button id="refreshBtn">刷新列表</button>
            <table>
                <thead>
                    <tr>
                        <th>标题</th>
                        <th>价格</th>
                        <th>卖家</th>
                        <th>抓取时间</th>
                        <th>链接</th>
                    </tr>
                </thead>
                <tbody id="itemTable">
                    <tr><td colspan="5" class="empty">暂无数据</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="/app.js"></script>
</body>
</html>
